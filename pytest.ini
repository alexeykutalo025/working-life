[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    real_files: needs real PST/OST files in tests/fixtures/real/ (skipped when absent)
    outlook_com: needs Microsoft Outlook installed for COM automation (skipped when absent)
    slow: long-running test
filterwarnings =
    ignore::DeprecationWarning
